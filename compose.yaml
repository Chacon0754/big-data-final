name: nyc-taxi-final

x-spark: &spark
  image: apache/spark:4.0.1-python3
  volumes:
    - ./data:/workspace/data

x-worker: &worker
  <<: *spark
  depends_on:
    spark-master:
      condition: service_healthy
  command:
    - /opt/spark/bin/spark-class
    - org.apache.spark.deploy.worker.Worker
    - --cores
    - "1"
    - --memory
    - 2g
    - spark://spark-master:7077
  healthcheck:
    test: [ "CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8081), timeout=3).close()" ]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  spark-master:
    <<: *spark
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    ports:
      - "127.0.0.1:28087:8080"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import socket; socket.create_connection(('spark-master', 7077), timeout=3).close()" ]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-worker-1:
    <<: *worker
    hostname: spark-worker-1

  spark-worker-2:
    <<: *worker
    hostname: spark-worker-2

  spark-worker-3:
    <<: *worker
    hostname: spark-worker-3

  jupyter:
    build: ./docker/jupyter
    hostname: jupyter
    working_dir: /workspace
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
      PYSPARK_PYTHON: /usr/bin/python3
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/workspace
    ports:
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:14047:4040"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./screenshots:/workspace/screenshots:ro
    depends_on:
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      spark-worker-3:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27087:27017"
    volumes:
      - mongo_data:/data/db
      - ./data/processed:/imports:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo_data:
